<?xml version="1.0" encoding="UTF-8"?>
<!--
  MuseV2 app icon — the ✻ spark on an ivory squircle.

  macOS (Big Sur and later) does not mask non-App-Store icons, so the shape
  lives in the art: an 824×824 squircle on the 1024 canvas, the standard
  100px margin, with its own soft drop shadow.

  Layers:
    • shadow  — soft drop under the squircle
    • bg      — ivory squircle, faint top-to-bottom warmth
    • rim     — hairline inner edge so it holds on light backgrounds
    • spark   — eight clay petals (same geometry as the tray icon and the
                composer's ✻, scaled)

  Rebuild: npx electron scripts/render-icon.js
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#f0ece2"/>
    </linearGradient>
    <linearGradient id="clay" gradientUnits="userSpaceOnUse" x1="330" y1="270" x2="700" y2="760">
      <stop offset="0" stop-color="#e08566"/>
      <stop offset="1" stop-color="#c25d3c"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect id="bg" x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect id="rim" x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000" stroke-opacity="0.06"/>

  <g id="spark" fill="url(#clay)">
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(0 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(45 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(90 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(135 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(180 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(225 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(270 512 512)"/>
    <ellipse cx="512" cy="356" rx="38" ry="104" transform="rotate(315 512 512)"/>
  </g>
</svg>
